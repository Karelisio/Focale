name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Version créée depuis le site GitHub : les APK signés y sont ajoutés.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint et APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      # Les captures d'interface sont comparées aux références de app/src/test/screenshots.
      - name: Tests unitaires
        run: ./gradlew testStandardDebugUnitTest -Proborazzi.test.verify=true --stacktrace

      - name: Lint
        run: ./gradlew lintStandardDebug

      # Signature release facultative : sans secrets, l'APK release est signé avec la
      # clé de debug (installable, mais non publiable sur un store).
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCALE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focale.jks"
            echo "FOCALE_STORE_FILE=$RUNNER_TEMP/focale.jks" >> "$GITHUB_ENV"
          fi

      # Une invocation par variante release : deux passes R8 simultanées saturent la mémoire.
      - name: APK release (standard)
        env:
          FOCALE_STORE_PASSWORD: ${{ secrets.FOCALE_STORE_PASSWORD }}
          FOCALE_KEY_ALIAS: ${{ secrets.FOCALE_KEY_ALIAS }}
          FOCALE_KEY_PASSWORD: ${{ secrets.FOCALE_KEY_PASSWORD }}
        run: ./gradlew assembleStandardRelease

      - name: APK release (strict, sans réseau)
        env:
          FOCALE_STORE_PASSWORD: ${{ secrets.FOCALE_STORE_PASSWORD }}
          FOCALE_KEY_ALIAS: ${{ secrets.FOCALE_KEY_ALIAS }}
          FOCALE_KEY_PASSWORD: ${{ secrets.FOCALE_KEY_PASSWORD }}
        run: ./gradlew assembleStrictRelease

      - name: APK debug
        run: ./gradlew assembleStandardDebug

      - name: Publication des artefacts
        uses: actions/upload-artifact@v5
        with:
          name: focale-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    name: Version GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Historique complet : les notes de version sont tirées des commits depuis la version précédente.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: focale-apk-${{ github.sha }}
          path: apk
      # Version déjà créée (depuis le site GitHub) : on y ajoute les APK ; sinon on la crée.
      - name: Publication des APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' apks < <(find apk -path "*release*" -name "*.apk" -print0)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${apks[@]}" --repo "$GITHUB_REPOSITORY"
          fi
      # Version publiée sans description : liste des changements depuis la précédente,
      # affichée par l'application (« Nouveautés »).
      - name: Notes de version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
            changes=$(git log --no-merges --pretty='%s' "${previous:+$previous..}$GITHUB_REF_NAME" \
              | grep -Ev '^(ci|chore|docs|test|build|style|refactor)(\(.+\))?!?:' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//; s/^(.)/\U\1/; s/^/- /' || true)
            if [ -n "$changes" ]; then
              printf '## Nouveautés\n\n%s\n' "$changes" > notes.md
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          fi
