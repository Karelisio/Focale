name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Version créée depuis le site GitHub : les APK signés y sont ajoutés.
  release:
    types: [published]
  # Lancement manuel ; avec une version, publie aussi la version GitHub vX.Y.Z.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (X.Y.Z), vide pour un simple build"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint et APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Version d'un lancement manuel ; sinon tirée du tag (voir app/build.gradle.kts).
      FOCALE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      # Les captures d'interface sont comparées aux références de app/src/test/screenshots.
      - name: Tests unitaires
        run: ./gradlew testStandardDebugUnitTest -Proborazzi.test.verify=true --stacktrace

      - name: Lint
        run: ./gradlew lintStandardDebug

      # Signature release facultative : sans secrets, l'APK release est signé avec la
      # clé de debug (installable, mais non publiable sur un store).
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCALE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focale.jks"
            echo "FOCALE_STORE_FILE=$RUNNER_TEMP/focale.jks" >> "$GITHUB_ENV"
          fi

      # Une invocation par variante release : deux passes R8 simultanées saturent la mémoire.
      - name: APK release (standard)
        env:
          FOCALE_STORE_PASSWORD: ${{ secrets.FOCALE_STORE_PASSWORD }}
          FOCALE_KEY_ALIAS: ${{ secrets.FOCALE_KEY_ALIAS }}
          FOCALE_KEY_PASSWORD: ${{ secrets.FOCALE_KEY_PASSWORD }}
        run: ./gradlew assembleStandardRelease

      - name: APK release (strict, sans réseau)
        env:
          FOCALE_STORE_PASSWORD: ${{ secrets.FOCALE_STORE_PASSWORD }}
          FOCALE_KEY_ALIAS: ${{ secrets.FOCALE_KEY_ALIAS }}
          FOCALE_KEY_PASSWORD: ${{ secrets.FOCALE_KEY_PASSWORD }}
        run: ./gradlew assembleStrictRelease

      - name: APK debug
        run: ./gradlew assembleStandardDebug

      - name: Publication des artefacts
        uses: actions/upload-artifact@v5
        with:
          name: focale-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    name: Version GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      # Historique complet : notes tirées des commits à défaut de CHANGELOG.md.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: focale-apk-${{ github.sha }}
          path: apk
      # Section de CHANGELOG.md pour cette version, à défaut la liste des commits depuis
      # la version précédente ; affichées par l'application (« Nouveautés »).
      - name: Notes de version
        run: |
          heading="## ${TAG#v}"
          changes=$(awk -v h="$heading" 'index($0, h) == 1 && substr($0, length(h) + 1, 1) !~ /[0-9.]/ { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md)
          if [ -z "$(echo "$changes" | tr -d '[:space:]')" ]; then
            previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
            changes=$(git log --no-merges --pretty='%s' "${previous:+$previous..}$GITHUB_SHA" \
              | grep -Ev '^(ci|chore|docs|test|build|style|refactor|perf)(\(.+\))?!?:|^Fusion' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//; s/^(.)/\U\1/; s/^/- /' || true)
          fi
          printf '## Nouveautés\n\n%s\n' "$changes" > notes.md
      # Version créée depuis le site GitHub : on y ajoute les APK (et les notes si elle
      # n'en a pas) ; sinon (tag poussé, lancement manuel) on la crée.
      - name: Publication des APK
        run: |
          mapfile -d '' apks < <(find apk -path "*release*" -name "*.apk" -print0)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            gh release create "$TAG" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Focale ${TAG#v}" --notes-file notes.md
          fi
