name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Version créée depuis le site GitHub : les APK signés y sont ajoutés.
  release:
    types: [published]
  # Lancement manuel ; avec une version, publie aussi la version GitHub vX.Y.Z.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (X.Y.Z), vide pour un simple build"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint et APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Version d'un lancement manuel ; sinon tirée du tag (voir app/build.gradle.kts).
      FOCALE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      # Les captures d'interface sont comparées aux références de app/src/test/screenshots.
      - name: Tests unitaires
        run: ./gradlew testStandardDebugUnitTest -Proborazzi.test.verify=true --stacktrace

      - name: Lint
        run: ./gradlew lintStandardDebug

      # Signature release facultative : sans secrets, l'APK release est signé avec la
      # clé de debug (installable, mais non publiable sur un store).
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCALE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focale.jks"
            echo "FOCALE_STORE_FILE=$RUNNER_TEMP/focale.jks" >> "$GITHUB_ENV"
          fi

      # Une invocation par variante release : deux passes R8 simultanées saturent la mémoire.
      - name: APK release (standard)
        env:
          FOCALE_STORE_PASSWORD: ${{ secrets.FOCALE_STORE_PASSWORD }}
          FOCALE_KEY_ALIAS: ${{ secrets.FOCALE_KEY_ALIAS }}
          FOCALE_KEY_PASSWORD: ${{ secrets.FOCALE_KEY_PASSWORD }}
        run: ./gradlew assembleStandardRelease

      - name: APK release (strict, sans réseau)
        env:
          FOCALE_STORE_PASSWORD: ${{ secrets.FOCALE_STORE_PASSWORD }}
          FOCALE_KEY_ALIAS: ${{ secrets.FOCALE_KEY_ALIAS }}
          FOCALE_KEY_PASSWORD: ${{ secrets.FOCALE_KEY_PASSWORD }}
        run: ./gradlew assembleStrictRelease

      # R8 peut retirer le constructeur d'une classe que le manifeste nomme et qu'une
      # bibliothèque instancie par réflexion (ML Kit) : l'APK démarre, l'analyse échoue.
      - name: Contrôle des APK release
        run: |
          for apk in app/build/outputs/apk/*/release/*-universal-release.apk; do
            python3 tools/release/check_constructors.py "$apk"
            python3 tools/release/check_privacy.py "$apk"
          done

      - name: APK debug
        run: ./gradlew assembleStandardDebug

      - name: Publication des artefacts
        uses: actions/upload-artifact@v5
        with:
          name: focale-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # L'APK release universel (standard) sur un émulateur : mise à jour par-dessus la dernière
  # version publiée, langue, impression, écran externe, sauvegarde et restauration des données,
  # et analyse de deux images (étiquettes, texte et visages). En 1.4.0, R8 cassait l'analyse en
  # release seulement. Voir tools/release/smoke_test.sh.
  smoke:
    name: Test de fumée (émulateur)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: focale-apk-${{ github.sha }}
          path: apk

      - name: APK à tester
        run: |
          apk=$(find apk -name app-standard-universal-release.apk -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::app-standard-universal-release.apk absent de l'artefact"
            exit 1
          fi
          echo "SMOKE_APK=$apk" >> "$GITHUB_ENV"

      # Dernière version GitHub que cet APK peut mettre à jour (même signature, pas plus
      # récente) ; sans elle, la mise à jour n'est pas testée (avertissement).
      - name: Version publiée précédente
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release/version_precedente.sh "$SMOKE_APK" "$RUNNER_TEMP/precedente"

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Image google_apis (sans Play Store) : adb root, pour lire la base de l'application.
      # Clavier matériel : pas de clavier à l'écran par-dessus les dialogues pilotés.
      - name: Test sur émulateur
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          FOCALE_SMOKE_ARTEFACTS: ${{ runner.temp }}/fumee
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 4096M
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/release/smoke_test.sh "$SMOKE_APK" "${SMOKE_PREVIOUS_APK:-}"

      # Captures d'écran des étapes et journal complet de l'émulateur, pour comprendre un échec.
      - name: Captures et journal de l'émulateur
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fumee-${{ github.sha }}
          path: ${{ runner.temp }}/fumee/
          if-no-files-found: ignore

  release:
    name: Version GitHub
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      # Historique complet : notes tirées des commits à défaut de CHANGELOG.md.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: focale-apk-${{ github.sha }}
          path: apk
      # Section de CHANGELOG.md pour cette version, à défaut la liste des commits depuis
      # la version précédente ; affichées par l'application (« Nouveautés »).
      - name: Notes de version
        run: |
          heading="## ${TAG#v}"
          changes=$(awk -v h="$heading" 'index($0, h) == 1 && substr($0, length(h) + 1, 1) !~ /[0-9.]/ { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md)
          if [ -z "$(echo "$changes" | tr -d '[:space:]')" ]; then
            previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
            changes=$(git log --no-merges --pretty='%s' "${previous:+$previous..}$GITHUB_SHA" \
              | grep -Ev '^(ci|chore|docs|test|build|style|refactor|perf)(\(.+\))?!?:|^Fusion' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//; s/^(.)/\U\1/; s/^/- /' || true)
          fi
          printf '## Nouveautés\n\n%s\n' "$changes" > notes.md
      # Version créée depuis le site GitHub : on y ajoute les APK (et les notes si elle
      # n'en a pas) ; sinon (tag poussé, lancement manuel) on la crée.
      - name: Publication des APK
        run: |
          mapfile -d '' apks < <(find apk -path "*release*" -name "*.apk" -print0)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            gh release create "$TAG" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Focale ${TAG#v}" --notes-file notes.md
          fi
